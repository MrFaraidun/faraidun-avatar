            if (blinkFrames[i] && !inBlink) {
              inBlink = true;
              blinkStartFrame = i;
            } else if (!blinkFrames[i] && inBlink) {
              inBlink = false;
              const startTime = blinkStartFrame / fps;
              const endTime = i / fps;
              tl.set("#presenter-eyes-open", { display: "none" }, startTime);
              tl.set("#presenter-eyes-closed", { display: "block" }, startTime);
              tl.set("#presenter-eyes-open", { display: "block" }, endTime);
              tl.set("#presenter-eyes-closed", { display: "none" }, endTime);
            }
          }
          if (inBlink) {
            const startTime = blinkStartFrame / fps;
            const endTime = blinkFrames.length / fps;
            tl.set("#presenter-eyes-open", { display: "none" }, startTime);
            tl.set("#presenter-eyes-closed", { display: "block" }, startTime);
            tl.set("#presenter-eyes-open", { display: "block" }, endTime);
            tl.set("#presenter-eyes-closed", { display: "none" }, endTime);
          }
        }

        // 3. Head sway and nods
        const headSelector = "#presenter-head";
        tl.set(headSelector, { transformOrigin: "325px 480px", y: 0, rotation: -1.8 }, 0);
        // Continuous head sway (-1.8 to +1.8 deg) repeated 22 times (~39.6s)
        tl.to(headSelector, { rotation: 1.8, duration: 1.8, yoyo: true, repeat: 22, ease: "sine.inOut" }, 0);

        // Head nods on key words (0.5s duration)
        const nodTimestamps = [
          0.72, 5.36, 12.40, 15.46, 23.40, 30.18, 36.34
        ];
        for (const t of nodTimestamps) {
          tl.to(headSelector, { y: "+=12px", rotation: 3, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
        }

        // 4. Hand gestures
        const pointingSelector = "#hand-pointing";
        const palmSelector = "#hand-palm";
        tl.set(pointingSelector, { y: 220, opacity: 0, transformOrigin: "180px 770px" }, 0);
        tl.set(palmSelector, { y: 220, opacity: 0, transformOrigin: "470px 770px" }, 0);

        const gestures = [
          { target: pointingSelector, start: 7.18, end: 8.88 },
          { target: palmSelector, start: 13.54, end: 15.24 },
          { target: palmSelector, start: 20.08, end: 21.78 },
          { target: pointingSelector, start: 25.40, end: 27.10 }
        ];

        for (const g of gestures) {
          const enterDuration = 0.3;
          const exitDuration = 0.3;
          const exitStartTime = g.end - exitDuration;
          tl.fromTo(g.target,
            { y: 220, opacity: 0 },
            { y: 0, opacity: 1, duration: enterDuration, ease: "back.out(1.4)" },
            g.start
          );
          tl.to(g.target,
            { y: 220, opacity: 0, duration: exitDuration, ease: "power2.in" },
            exitStartTime
          );
        }

        tl.seek(0);
      })();
    </script>
  </body>
</html>
