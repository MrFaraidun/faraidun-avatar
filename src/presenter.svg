<svg id="presenter-svg" viewBox="0 0 650 770" width="650" height="770" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .p-stroke { stroke: #241914; stroke-width: 6px; stroke-linecap: round; stroke-linejoin: round; }
      .p-skin { fill: #E8BA9B; }
      .p-hoodie { fill: #D7372C; }
      .p-hoodie-inner { fill: #B82B21; }
      .p-ink { fill: #241914; }
      .p-white { fill: #FBFAF8; }
      .p-teeth { fill: #FBFAF8; }
      .p-mouth-bg { fill: #381513; }
      .p-tongue { fill: #D7554C; }
      .mouth-shape { display: none; }
      .mouth-0 { display: block; }
    </style>
  </defs>

  <!-- ROOT GROUP -->
  <g id="presenter-rig">
    <!-- BODY / HOODIE (STATIONARY CHEST CROP) -->
    <g id="presenter-body">
      <!-- Torso / Shoulders -->
      <path class="p-hoodie p-stroke" d="M 50 770 C 50 630 140 540 260 520 L 390 520 C 510 540 600 630 600 770 Z" />
      <!-- Hoodie Hood Collar / Drawstrings -->
      <path class="p-hoodie-inner p-stroke" d="M 230 520 C 230 620 420 620 420 520 Z" />
      <!-- Drawstring cords -->
      <path class="p-stroke" stroke="#FBFAF8" fill="none" stroke-width="5" d="M 270 560 L 270 650" />
      <path class="p-stroke" stroke="#FBFAF8" fill="none" stroke-width="5" d="M 380 560 L 380 640" />
      <circle cx="270" cy="655" r="5" class="p-stroke p-white" />
      <circle cx="380" cy="645" r="5" class="p-stroke p-white" />
    </g>

    <!-- HEAD GROUP (SWAYS AND NODS) -->
    <g id="presenter-head" style="transform-origin: 325px 480px;">
      <!-- Neck -->
      <path class="p-skin p-stroke" d="M 275 440 L 275 530 C 310 540 340 540 375 530 L 375 440 Z" />

      <!-- Ears -->
      <path class="p-skin p-stroke" d="M 180 320 C 160 320 160 370 185 375 Z" />
      <path class="p-skin p-stroke" d="M 470 320 C 490 320 490 370 465 375 Z" />

      <!-- Head base shape -->
      <path class="p-skin p-stroke" d="M 190 280 C 190 150 460 150 460 280 C 460 410 400 460 325 460 C 250 460 190 410 190 280 Z" />

      <!-- Stylized Hair -->
      <path class="p-ink p-stroke" d="M 185 270 C 175 220 210 140 280 130 C 330 120 420 125 460 180 C 475 200 470 250 465 270 C 455 240 435 220 405 215 C 385 210 365 225 335 215 C 305 205 290 220 265 225 C 235 230 215 250 185 270 Z" />

      <!-- Eyebrows -->
      <g id="presenter-brows">
        <path class="p-stroke" fill="none" stroke-width="8" stroke="#241914" d="M 225 275 Q 260 265 285 275" />
        <path class="p-stroke" fill="none" stroke-width="8" stroke="#241914" d="M 365 275 Q 390 265 425 275" />
      </g>

      <!-- Eyes (Open vs Closed) -->
      <g id="presenter-eyes-open">
        <!-- Left eye -->
        <circle cx="255" cy="305" r="16" fill="#FBFAF8" class="p-stroke" />
        <circle cx="257" cy="305" r="9" class="p-ink" />
        <circle cx="254" cy="302" r="3" fill="#FBFAF8" />
        <!-- Right eye -->
        <circle cx="395" cy="305" r="16" fill="#FBFAF8" class="p-stroke" />
        <circle cx="397" cy="305" r="9" class="p-ink" />
        <circle cx="394" cy="302" r="3" fill="#FBFAF8" />
      </g>

      <g id="presenter-eyes-closed" style="display: none;">
        <!-- Left shut eyelid -->
        <path class="p-stroke" fill="none" stroke-width="6" stroke="#241914" d="M 240 308 Q 255 318 270 308" />
        <!-- Right shut eyelid -->
        <path class="p-stroke" fill="none" stroke-width="6" stroke="#241914" d="M 380 308 Q 395 318 410 308" />
      </g>

      <!-- Glasses -->
      <g id="presenter-glasses">
        <!-- Frame Left -->
        <rect x="220" y="278" width="72" height="54" rx="14" fill="none" stroke="#241914" stroke-width="8" />
        <!-- Frame Right -->
        <rect x="358" y="278" width="72" height="54" rx="14" fill="none" stroke="#241914" stroke-width="8" />
        <!-- Bridge -->
        <path d="M 292 298 Q 325 290 358 298" fill="none" stroke="#241914" stroke-width="8" stroke-linecap="round" />
        <!-- Temples -->
        <path d="M 220 295 L 182 305" fill="none" stroke="#241914" stroke-width="7" stroke-linecap="round" />
        <path d="M 430 295 L 468 305" fill="none" stroke="#241914" stroke-width="7" stroke-linecap="round" />
        <!-- Subtle lens sheen -->
        <path d="M 230 290 L 250 286" stroke="#FBFAF8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
        <path d="M 368 290 L 388 286" stroke="#FBFAF8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
      </g>

      <!-- Nose -->
      <path class="p-stroke" fill="none" stroke-width="5" stroke="#241914" d="M 320 325 Q 328 348 320 355 C 326 357 334 354 336 348" />

      <!-- 10 MOUTH SHAPES (0 to 9) -->
      <g id="presenter-mouths">
        <!-- Shape 0: Closed line seam -->
        <g id="mouth-0" class="mouth-shape mouth-0">
          <path class="p-stroke" fill="none" stroke-width="6" stroke="#241914" d="M 298 396 Q 325 402 352 396" />
        </g>

        <!-- Shape 1: Slight relaxed slit -->
        <g id="mouth-1" class="mouth-shape">
          <path class="p-mouth-bg p-stroke" d="M 298 395 Q 325 402 352 395 Q 325 407 298 395 Z" />
        </g>

        <!-- Shape 2: Small round 'oo' / 'w' -->
        <g id="mouth-2" class="mouth-shape">
          <ellipse cx="325" cy="398" rx="14" ry="12" class="p-mouth-bg p-stroke" />
        </g>

        <!-- Shape 3: Medium round 'o' -->
        <g id="mouth-3" class="mouth-shape">
          <ellipse cx="325" cy="400" rx="20" ry="17" class="p-mouth-bg p-stroke" />
          <path d="M 312 408 Q 325 400 338 408 Q 325 417 312 408 Z" class="p-tongue" />
        </g>

        <!-- Shape 4: Flat teeth 'ee' / 's' -->
        <g id="mouth-4" class="mouth-shape">
          <path class="p-mouth-bg p-stroke" d="M 292 396 Q 325 393 358 396 Q 355 409 325 410 Q 295 409 292 396 Z" />
          <path d="M 296 397 Q 325 395 354 397 L 352 403 Q 325 402 298 403 Z" class="p-teeth" />
        </g>

        <!-- Shape 5: Medium smile open -->
        <g id="mouth-5" class="mouth-shape">
          <path class="p-mouth-bg p-stroke" d="M 290 395 Q 325 390 360 395 C 360 418 345 425 325 425 C 305 425 290 418 290 395 Z" />
          <path d="M 294 395 Q 325 392 356 395 L 354 402 Q 325 400 296 402 Z" class="p-teeth" />
          <path d="M 306 416 Q 325 407 344 416 Q 325 425 306 416 Z" class="p-tongue" />
        </g>

        <!-- Shape 6: Medium open 'ah' -->
        <g id="mouth-6" class="mouth-shape">
          <path class="p-mouth-bg p-stroke" d="M 295 395 Q 325 392 355 395 C 355 425 342 432 325 432 C 308 432 295 425 295 395 Z" />
          <path d="M 298 395 Q 325 393 352 395 L 350 401 Q 325 400 300 401 Z" class="p-teeth" />
          <path d="M 308 422 Q 325 413 342 422 Q 325 432 308 422 Z" class="p-tongue" />
        </g>

        <!-- Shape 7: Wide open speech -->
        <g id="mouth-7" class="mouth-shape">
          <path class="p-mouth-bg p-stroke" d="M 288 394 Q 325 388 362 394 C 362 428 348 438 325 438 C 302 438 288 428 288 394 Z" />
          <path d="M 292 394 Q 325 390 358 394 L 355 403 Q 325 401 295 403 Z" class="p-teeth" />
          <path d="M 304 425 Q 325 414 346 425 Q 325 438 304 425 Z" class="p-tongue" />
        </g>

        <!-- Shape 8: Broad open vowel -->
        <g id="mouth-8" class="mouth-shape">
          <path class="p-mouth-bg p-stroke" d="M 285 393 Q 325 386 365 393 C 365 435 348 444 325 444 C 302 444 285 435 285 393 Z" />
          <path d="M 290 393 Q 325 388 360 393 L 357 404 Q 325 402 293 404 Z" class="p-teeth" />
          <path d="M 300 430 Q 325 416 350 430 Q 325 444 300 430 Z" class="p-tongue" />
        </g>

        <!-- Shape 9: Maximum wide open shout -->
        <g id="mouth-9" class="mouth-shape">
          <path class="p-mouth-bg p-stroke" d="M 280 392 Q 325 384 370 392 C 370 442 350 452 325 452 C 300 452 280 442 280 392 Z" />
          <path d="M 286 392 Q 325 386 364 392 L 361 405 Q 325 403 289 405 Z" class="p-teeth" />
          <path d="M 295 436 Q 325 420 355 436 Q 325 452 295 436 Z" class="p-tongue" />
        </g>
      </g>
    </g>

    <!-- HANDS -->
    <!-- Pointing hand (raises from below) -->
    <g id="hand-pointing" style="transform-origin: 180px 770px; opacity: 0;">
      <!-- Forearm sleeve -->
      <path class="p-hoodie p-stroke" d="M 120 770 L 150 560 L 210 575 L 180 770 Z" />
      <!-- Hand / Pointing Finger -->
      <path class="p-skin p-stroke" d="M 155 565 C 150 535 155 460 170 450 C 182 442 195 452 190 480 L 188 535 C 198 535 215 545 210 565 C 205 580 185 585 155 565 Z" />
      <!-- Finger crease -->
      <path class="p-stroke" fill="none" stroke-width="4" stroke="#241914" d="M 172 490 L 185 494" />
    </g>

    <!-- Open Palm Hand (raises from below) -->
    <g id="hand-palm" style="transform-origin: 470px 770px; opacity: 0;">
      <!-- Forearm sleeve -->
      <path class="p-hoodie p-stroke" d="M 440 770 L 460 570 L 525 555 L 500 770 Z" />
      <!-- Open Palm Hand -->
      <path class="p-skin p-stroke" d="M 465 570 C 455 530 460 470 480 465 C 495 460 505 480 500 515 C 510 485 525 480 535 495 C 540 515 530 540 525 555 C 515 575 490 580 465 570 Z" />
    </g>
  </g>
</svg>